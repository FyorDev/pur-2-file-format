[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pur-2-file-format"
version = "0.1.0"
description = "Independent reader and from-scratch writer for the tested PureRef 2.1 file format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pureref2 = "pureref2:main"

[project.urls]
Repository = "https://github.com/Vacyyyy/pur-2-file-format"
Issues = "https://github.com/Vacyyyy/pur-2-file-format/issues"

[tool.setuptools]
py-modules = ["pureref2"]
